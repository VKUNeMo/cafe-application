name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      CAFE_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Tests without private checkpoints
        run: python -m pytest -m "not integration"
