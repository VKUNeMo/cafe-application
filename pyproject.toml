[project]
name = "coffee-leaf-application"
version = "3.0.0"
description = "FastAPI application for coffee leaf disease classification"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires private model checkpoints (excluded from CI)"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
